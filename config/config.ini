[DEFAULT]
host = localhost
port = 15050
debug = False
input_folder = ./input
output_folder = ./output
override_existed = False
supported_file_suffixes = .jpeg,.jpg,.png,.heic,.heif,.hif,.dng,.jxl,.avif,.webp,.tif,.tiff
# RAW(ProRAW) 解码方式: auto=有全尺寸内嵌预览图时使用(与 iPhone 相册观感一致), 否则解码 RAW; preview=优先内嵌预览图; raw=优先解码 RAW
raw_decode_mode = auto
quality = 60
subsampling = 2

[render]
template_name = 文件夹名+右下角参数

